<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
    <script src="/js/theme-init.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="cart.meta_title">سلة التسوق | متجر رِواق</title>
  <!-- Preload Primary Font for LCP / Text Performance -->
  <link rel="preload" href="/fonts/font-1.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Local Fonts & Icons -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/style.min.css">

  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/images/logo.png">

</head>
<body>
  <!-- رأس الموقع الموحد -->
  <header id="site-header"></header>

  <!-- عنوان الصفحة -->
  <div class="page-title">
    <div class="container">
      <h1 data-i18n="cart.title">عربة التسوق</h1>
      <div class="breadcrumb">
        <a href="index.html"><span data-i18n="footer.link_home">الرئيسية</span></a> <i class="fas fa-chevron-left"></i> <span data-i18n="cart.title">عربة التسوق</span>
      </div>
    </div>
  </div>

  <!-- قسم عربة التسوق -->
  <section class="cart-section">
    <div class="container">
      <div class="cart-container">
        <div class="cart-items">
          <div class="cart-items-header" id="cart-items-header">
            <h2><span data-i18n="cart.added_products">المنتجات المضافة</span></h2>
          </div>
          <div class="cart-items-grid" id="cart-items-grid">
            <!-- يتم تعبئتها ديناميكيًا عبر JavaScript -->
          </div>
          <div class="empty-state empty-cart-box" id="empty-cart" style="display: none;">
            <div class="empty-state-icon">
              <i class="fas fa-shopping-cart"></i>
            </div>
            <h3 class="empty-state-title"><span data-i18n="cart.empty_title">عربة التسوق فارغة حالياً</span></h3>
            <p class="empty-state-desc"><span data-i18n="cart.empty_desc">لم تقم بإضافة أي منتجات إلى سلتك بعد. استكشف تشكيلتنا الواسعة وابدأ التسوق الآن.</span></p>
            <a href="shop.html" class="btn btn-primary btn-browse-shop">
              <i class="fas fa-shopping-bag"></i> <span data-i18n="cart.browse_shop">تصفح متجر المنتجات</span>
            </a>
          </div>
        </div>

        <div class="cart-summary" id="cart-summary">
          <!-- ملخص الطلب يتم توليده ديناميكيًا -->
        </div>
      </div>
    </div>
  </section>

  <!-- التذييل الموحد -->
  <footer id="site-footer"></footer>

  <script src="js/layout.js" defer></script>
  <script src="js/api-client.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/user-system.js" defer></script>
  <script src="js/wishlist.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/pages/cart.js" defer></script>
</body>
</html>
