<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.min.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="cart.meta_title">سلة التسوق | متجر رواق</title>
  <meta name="description" data-i18n="cart.meta_description" content="عرض وإدارة المنتجات المضافة إلى عربة التسوق في متجر رواق. تابع إتمام الطلب الآن للحصول على أفضل الأزياء والمنتجات.">
  <!-- Preload Primary Fonts for LCP / Text Performance -->
  <link rel="preload" href="/fonts/font-1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/font-3.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Critical CSS for Instant Paint and Zero CLS -->
  <style>
    :root{--primary-color:#4f46e5;--dark-color:#0f172a;--border-color:#e2e8f0;--card-bg:#ffffff;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Cairo',system-ui,-apple-system,sans-serif;color:#1e293b;background-color:#f8fafc;line-height:1.6;}
    .container{width:100%;max-width:1240px;margin:0 auto;padding:0 16px;}
    #site-header{display:block;min-height:154px;}
    .page-title{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);color:#fff;padding:24px 0;min-height:88px;}
    .page-title h1{font-size:1.5rem;font-weight:800;margin-bottom:6px;}
    .breadcrumb{font-size:0.85rem;color:rgba(255,255,255,0.75);display:flex;align-items:center;gap:8px;}
    .breadcrumb a{color:#fff;text-decoration:none;}
    .cart-section{padding:30px 0 60px;min-height:500px;}
    .cart-container{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start;margin-top:24px;}
    .cart-item-img-wrap{display:block;width:85px;height:85px;border-radius:10px;overflow:hidden;flex-shrink:0;}
    @media(max-width:992px){
      .cart-container{grid-template-columns:1fr;gap:24px;}
    }
    @media(max-width:768px){
      #site-header{min-height:144px;}
    }
  </style>

  <!-- Core Design Stylesheet -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.min.css">
  <noscript><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"></noscript>

  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/images/logo.png">

</head>
<body>
  <!-- رأس الموقع الموحد -->
  <header id="site-header"></header>

  <main id="main-content">
    <!-- عنوان الصفحة -->
    <div class="page-title">
      <div class="container">
        <h1 data-i18n="cart.title">عربة التسوق</h1>
        <div class="breadcrumb">
          <a href="index.html"><span data-i18n="footer.link_home">الرئيسية</span></a> <i class="fas fa-chevron-left"></i> <span data-i18n="cart.title">عربة التسوق</span>
        </div>
      </div>
    </div>

    <!-- قسم عربة التسوق -->
    <section class="cart-section">
      <div class="container">
        <div class="cart-container">
          <div class="cart-items">
            <div class="cart-items-header" id="cart-items-header">
              <h2><span data-i18n="cart.added_products">المنتجات المضافة</span></h2>
            </div>
            <div class="cart-items-grid" id="cart-items-grid">
              <!-- يتم تعبئتها ديناميكيًا عبر JavaScript -->
            </div>
            <div class="empty-state empty-cart-box" id="empty-cart" style="display: none;">
              <div class="empty-state-icon">
                <i class="fas fa-shopping-cart"></i>
              </div>
              <h3 class="empty-state-title"><span data-i18n="cart.empty_title">عربة التسوق فارغة حالياً</span></h3>
              <p class="empty-state-desc"><span data-i18n="cart.empty_desc">لم تقم بإضافة أي منتجات إلى سلتك بعد. استكشف تشكيلتنا الواسعة وابدأ التسوق الآن.</span></p>
              <a href="shop.html" class="btn btn-primary btn-browse-shop">
                <i class="fas fa-shopping-bag"></i> <span data-i18n="cart.browse_shop">تصفح متجر المنتجات</span>
              </a>
            </div>
          </div>

          <div class="cart-summary" id="cart-summary">
            <!-- ملخص الطلب يتم توليده ديناميكيًا -->
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- التذييل الموحد -->
  <footer id="site-footer"></footer>

  <!-- Main Deferred Scripts -->
  <script src="/js/pages/cart.min.js" defer></script>
  <script src="/js/layout.min.js" defer></script>
  <script src="/js/api-client.min.js" defer></script>
  <script src="/js/main.min.js" defer></script>
  <script src="/js/i18n.min.js" defer></script>
</body>
</html>
