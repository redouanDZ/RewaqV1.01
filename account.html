<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
        <script src="/js/theme-init.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="account.title">حسابي | متجر رِواق - إدارة الحساب والطلبات</title>
    <!-- Preload Primary Font for LCP / Text Performance -->
    <link rel="preload" href="/fonts/font-1.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Critical CSS for Instant Paint and Zero CLS -->
    <style>
      :root{--primary-color:#4f46e5;--primary-gradient:linear-gradient(135deg,#4f46e5 0%,#3730a3 100%);--dark-color:#0f172a;--border-color:#e2e8f0;--card-bg:#ffffff;--light-text:#64748b;--text-color:#1e293b;--danger-color:#ef4444;}
      *{box-sizing:border-box;margin:0;padding:0;}
      body{font-family:'Cairo',system-ui,-apple-system,sans-serif;color:var(--text-color);background-color:#f8fafc;line-height:1.6;}
      .container{width:100%;max-width:1200px;margin:0 auto;padding:0 16px;}
      #site-header{display:block;min-height:154px;}
      .account-page-container{max-width:1200px;margin:40px auto;padding:0 20px;display:grid;grid-template-columns:280px 1fr;gap:30px;min-height:520px;}
      .account-sidebar{background:var(--card-bg,#fff);border-radius:12px;padding:24px 20px;box-shadow:0 4px 20px rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.06);height:fit-content;}
      .user-card-header{text-align:center;padding-bottom:20px;border-bottom:1px solid rgba(0,0,0,0.08);margin-bottom:20px;}
      .user-avatar-circle{width:80px;height:80px;border-radius:50%;background:var(--primary-gradient);color:#fff;font-size:2.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
      .user-card-header h3{font-size:1.2rem;margin:0 0 4px;color:var(--dark-color,#1e293b);}
      .user-card-header p{font-size:0.9rem;color:var(--light-text,#64748b);margin:0;}
      .account-nav-list{list-style:none;padding:0;margin:0;}
      .account-nav-list li{margin-bottom:8px;}
      .account-nav-btn{min-height:44px;width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;background:transparent;border:none;border-radius:8px;color:var(--text-color);font-size:0.98rem;font-weight:500;text-align:right;cursor:pointer;}
      .account-nav-btn.active{background:var(--primary-gradient);color:#fff;}
      .account-content-card{background:var(--card-bg,#fff);border-radius:12px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.06);min-height:500px;}
      .tab-section{display:none;}
      .tab-section.active{display:block;}
      .section-title{font-size:1.25rem;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--border-color);color:var(--dark-color);display:flex;align-items:center;justify-content:space-between;gap:12px;}
      .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
      .form-group{margin-bottom:16px;}
      .form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:0.9rem;color:var(--text-color);}
      .form-group input{width:100%;height:44px;padding:8px 14px;border:1px solid var(--border-color);border-radius:8px;font-family:inherit;}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;min-height:44px;background:var(--primary-gradient);color:white;border:none;border-radius:10px;cursor:pointer;font-size:0.94rem;font-weight:700;}
      @media(max-width:900px){.account-page-container{grid-template-columns:1fr;}}
      @media(max-width:768px){#site-header{min-height:144px;}}
      @media(max-width:600px){.account-page-container{margin:16px auto 30px;padding:0 12px;gap:16px;}.account-sidebar{padding:18px 14px;}.account-content-card{padding:20px 14px;}}
    </style>

    <!-- Asynchronous Non-blocking Stylesheets -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"></noscript>
    <link rel="stylesheet" href="/css/style.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/css/style.min.css"></noscript>

  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
      <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/images/logo.png">

</head>
<body>
    <!-- Header -->
    <header id="site-header"></header>

    <!-- Main Content Area -->
    <main class="account-page-container container">
        <!-- Sidebar Navigation -->
        <aside class="account-sidebar">
            <div class="user-card-header">
                <div class="user-avatar-circle" id="avatar-icon">
                    <i class="fas fa-user"></i>
                </div>
                <h3 id="sidebar-user-name">...</h3>
                <p id="sidebar-user-email" style="font-size:0.85rem;">...</p>
            </div>

            <ul class="account-nav-list">
                <li>
                    <button type="button" class="account-nav-btn active" data-tab="profile">
                        <i class="fas fa-user-cog"></i>
                        <span data-i18n="account.profile">الملف الشخصي</span>
                    </button>
                </li>
                <li>
                    <button type="button" class="account-nav-btn" data-tab="addresses">
                        <i class="fas fa-map-marker-alt"></i>
                        <span data-i18n="account.addresses">عناوين الشحن</span>
                    </button>
                </li>
                <li>
                    <button type="button" class="account-nav-btn" data-tab="orders">
                        <i class="fas fa-box"></i>
                        <span data-i18n="account.orders">طلباتي</span>
                    </button>
                </li>
                <li>
                    <button type="button" class="account-nav-btn" data-tab="wishlist">
                        <i class="fas fa-heart"></i>
                        <span><span data-i18n="account.wishlist_tab">قائمة المفضلة</span></span>
                    </button>
                </li>
                <li style="margin-top: 15px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 15px;">
                    <button type="button" class="account-nav-btn" id="logout-sidebar-btn" style="color: var(--danger-color);">
                        <i class="fas fa-sign-out-alt" style="color: var(--danger-color);"></i>
                        <span data-i18n="account.sidebar_logout">تسجيل الخروج</span>
                    </button>
                </li>
            </ul>
        </aside>

        <!-- Main Dashboard View Area -->
        <section class="account-content-card">
            <!-- TAB 1: Profile -->
            <div class="tab-section active" id="tab-profile">
                <div class="section-title">
                    <h1 style="font-size: 1.25rem; margin: 0; font-weight: 700; color: inherit; display: inline-flex; align-items: center; gap: 8px;"><i class="fas fa-user-edit" style="color: var(--primary-color);"></i> <span data-i18n="account.profile_data">بيانات الملف الشخصي</span></h1>
                </div>

                <form id="profile-update-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="profile-name" data-i18n="checkout.full_name">الاسم الكامل</label>
                            <input type="text" id="profile-name" required data-i18n-placeholder="account.profile_name_placeholder" placeholder="مثال: أحمد محمد">
                        </div>
                        <div class="form-group">
                            <label for="profile-phone" data-i18n="checkout.phone">رقم الهاتف</label>
                            <input type="tel" id="profile-phone" placeholder="0550000000">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="profile-email" data-i18n="checkout.email_label">البريد الإلكتروني</label>
                        <input type="email" id="profile-email" required placeholder="name@example.com">
                    </div>

                    <div style="margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                        <h4 style="margin-bottom: 15px; font-size: 1.1rem;" data-i18n="account.change_password">تغيير كلمة المرور</h4>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="profile-new-pass" data-i18n="account.new_pass">كلمة المرور الجديدة</label>
                                <input type="password" id="profile-new-pass" data-i18n-placeholder="account.new_pass_placeholder" placeholder="اتركه فارغاً إذا لم ترد التغيير">
                            </div>
                            <div class="form-group">
                                <label for="profile-confirm-pass" data-i18n="account.confirm_new_pass">تأكيد كلمة المرور الجديدة</label>
                                <input type="password" id="profile-confirm-pass" data-i18n-placeholder="account.confirm_pass_placeholder" placeholder="تأكيد كلمة المرور">
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 25px; display: flex; justify-content: flex-end;">
                        <button type="submit" class="btn" style="padding: 12px 30px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
                            <i class="fas fa-save"></i> <span data-i18n="account.save_changes_btn">حفظ التغيرات</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- TAB 2: Addresses -->
            <div class="tab-section" id="tab-addresses">
                <div class="section-title">
                    <span><i class="fas fa-map-marked-alt" style="color: var(--primary-color);"></i> <span data-i18n="account.saved_addresses">عناوين الشحن المحفوظة</span></span>
                    <button type="button" class="btn add-address-header-btn" id="open-add-address-btn">
                        <i class="fas fa-plus"></i> <span data-i18n="account.add_address">إضافة عنوان جديد</span>
                    </button>
                </div>

                <div class="addresses-grid" id="addresses-container">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

            <!-- TAB 3: Orders -->
            <div class="tab-section" id="tab-orders">
                <div class="section-title">
                    <span><i class="fas fa-shopping-bag" style="color: var(--primary-color);"></i><span data-i18n="account.order_history">سجل الطلبات</span></span>
                </div>

                <div class="order-history-list" id="orders-container">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

            <!-- TAB 4: Wishlist -->
            <div class="tab-section" id="tab-wishlist">
                <div class="section-title">
                    <span><i class="fas fa-heart" style="color: var(--danger-color);"></i><span data-i18n="account.wishlist_tab">قائمة المفضلة</span></span>
                </div>

                <div class="products-grid" id="wishlist-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal for Adding Address -->
    <div class="account-modal" id="add-address-modal" role="dialog" aria-modal="true" aria-labelledby="add-address-title">
        <div class="account-modal-content">
            <div class="account-modal-header">
                <h3 id="add-address-title">
                    <i class="fas fa-map-marker-alt" style="color:var(--primary-color);"></i>
                    <span data-i18n="account.add_new_address">إضافة عنوان شحن جديد</span>
                </h3>
                <button type="button" class="close-modal-btn" id="close-address-modal" aria-label="Close">&times;</button>
            </div>
            <form id="add-address-form" class="account-modal-form">
                <div class="account-modal-grid">
                    <div class="form-group">
                        <label for="addr-title"><span data-i18n="account.address_title">اسم العنوان (مثال: المنزل، العمل)</span></label>
                        <input type="text" id="addr-title" required data-i18n-placeholder="account.address_title_placeholder" placeholder="المنزل">
                    </div>
                    <div class="form-group">
                        <label for="addr-fullname"><span data-i18n="account.recipient_name">الاسم الكامل للمستلم</span></label>
                        <input type="text" id="addr-fullname" required data-i18n-placeholder="account.recipient_name_placeholder" placeholder="الاسم الكامل">
                    </div>
                </div>
                <div class="account-modal-grid">
                    <div class="form-group">
                        <label for="addr-phone" data-i18n="checkout.phone">رقم الهاتف</label>
                        <input type="tel" id="addr-phone" required placeholder="0550000000">
                    </div>
                    <div class="form-group">
                        <label for="addr-city"><span data-i18n="account.city_wilaya">المدينة / الولاية</span></label>
                        <input type="text" id="addr-city" required data-i18n-placeholder="account.algiers_placeholder" placeholder="الجزائر العاصمة">
                    </div>
                </div>
                <div class="form-group">
                    <label for="addr-street"><span data-i18n="account.detailed_address">العنوان التفصيلي</span></label>
                    <textarea id="addr-street" rows="3" required data-i18n-placeholder="account.detailed_address_placeholder" placeholder="اسم الشارع، رقم العمارة، الشقة..."></textarea>
                </div>
                <div class="modal-checkbox-row">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                        <input type="checkbox" id="addr-default" class="custom-checkbox-input"> <span data-i18n="account.set_default">تعيين كعنوان افتراضي</span>
                    </label>
                </div>
                <div class="account-modal-actions">
                    <button type="button" class="btn btn-secondary-modal" id="cancel-address-btn"><span data-i18n="common.cancel">إلغاء</span></button>
                    <button type="submit" class="btn"><span data-i18n="account.save_address">حفظ العنوان</span></button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modern Footer -->
    <footer id="site-footer"></footer>

    <!-- Scripts -->
    <script src="js/layout.js" defer></script>
    <script src="js/api-client.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/user-system.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/pages/account.js" defer></script>
</body>
</html>
