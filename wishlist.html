<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme-init.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="wishlist.meta_title">قائمة الرغبات | متجر رِواق - منتجاتك المفضلة</title>
    <!-- Preload Primary Font for LCP / Text Performance -->
    <link rel="preload" href="/fonts/font-1.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Critical CSS for Instant Paint and Zero CLS -->
    <style>
      :root{--primary-color:#4f46e5;--dark-color:#0f172a;--border-color:#e2e8f0;--card-bg:#ffffff;}
      *{box-sizing:border-box;margin:0;padding:0;}
      body{font-family:'Cairo',system-ui,-apple-system,sans-serif;color:#1e293b;background-color:#f8fafc;line-height:1.6;}
      .container{width:100%;max-width:1240px;margin:0 auto;padding:0 16px;}
      #site-header{display:block;min-height:154px;}
      .page-title{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);color:#fff;padding:24px 0;min-height:88px;}
      .page-title h1{font-size:1.5rem;font-weight:800;margin-bottom:6px;}
      .breadcrumb{font-size:0.85rem;color:rgba(255,255,255,0.75);display:flex;align-items:center;gap:8px;}
      .breadcrumb a{color:#fff;text-decoration:none;}
      .wishlist-section{padding:30px 0 60px;min-height:500px;}
      .wishlist-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;min-height:44px;}
      .wishlist-header h2{font-size:1.4rem;font-weight:800;margin:0;}
      #wishlistContainer{min-height:360px;}
      .wishlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:25px;}
      .card-img-wrapper{position:relative;width:100%;height:200px;background:var(--card-bg);}
      .card-img-wrapper img{width:100%;height:100%;object-fit:cover;}
      .empty-wishlist{text-align:center;padding:60px 20px;background:#fff;border-radius:12px;border:1px dashed #e2e8f0;min-height:320px;}
      @media(max-width:768px){
        #site-header{min-height:144px;}
      }
      @media(max-width:600px){
        .wishlist-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
        .card-img-wrapper{height:140px;}
      }
    </style>

    <!-- Asynchronous Non-blocking Stylesheets -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"></noscript>
    <link rel="stylesheet" href="/css/style.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/css/style.min.css"></noscript>

    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/images/logo.png">

</head>
<body>
    <!-- Header -->
    <header id="site-header"></header>

    <!-- Page Title -->
    <div class="page-title">
        <div class="container">
            <h1><span data-i18n="wishlist.page_title_alt">قائمة الرغبات والمفضلة</span></h1>
            <div class="breadcrumb">
                <a href="index.html"><span data-i18n="footer.link_home">الرئيسية</span></a> <i class="fas fa-chevron-left"></i> <span data-i18n="nav.wishlist">المفضلة</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <section class="wishlist-section">
        <div class="container">
            <div class="wishlist-header">
                <h2><span data-i18n="wishlist.saved_products">المنتجات المحفوظة</span></h2>
                <span class="wishlist-count-badge" id="wishlistHeaderCount"><span id="wishlistCountNum">0</span> <span data-i18n="wishlist.products_count">منتجات</span></span>
            </div>

            <div id="wishlistContainer">
                <div style="text-align: center; padding: 40px; color: var(--light-text);">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p><span data-i18n="wishlist.loading">جاري تحميل قائمة الرغبات...</span></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Modern Footer -->
    <footer id="site-footer"></footer>

    <!-- Main Deferred Scripts -->
    <script src="js/layout.js" defer></script>
    <script src="js/api-client.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/wishlist.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/pages/wishlist.js" defer></script>
</body>
</html>
