<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme-init.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="wishlist.meta_title">قائمة الرغبات | متجر رِواق - منتجاتك المفضلة</title>
    <!-- Preload Primary Font for LCP / Text Performance -->
    <link rel="preload" href="/fonts/font-1.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Local Fonts & Icons -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/style.min.css">

  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
      <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/images/logo.png">

</head>
<body>
    <!-- Header -->
    <header id="site-header"></header>


    <!-- Page Title -->
    <div class="page-title">
        <div class="container">
            <h1><span data-i18n="wishlist.page_title_alt">قائمة الرغبات والمفضلة</span></h1>
            <div class="breadcrumb">
                <a href="index.html"><span data-i18n="footer.link_home">الرئيسية</span></a> <i class="fas fa-chevron-left"></i> <span data-i18n="nav.wishlist">المفضلة</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <section class="wishlist-section">
        <div class="container">
            <div class="wishlist-header">
                <h1><span data-i18n="wishlist.saved_products">المنتجات المحفوظة</span></h1>
                <span class="wishlist-count-badge" id="wishlistHeaderCount"><span id="wishlistCountNum">0</span> <span data-i18n="wishlist.products_count">منتجات</span></span>
            </div>

            <div id="wishlistContainer">
                <div style="text-align: center; padding: 40px; color: var(--light-text);">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p><span data-i18n="wishlist.loading">جاري تحميل قائمة الرغبات...</span></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Modern Footer -->
    <footer id="site-footer"></footer>

    <script src="js/layout.js" defer></script>
    <script src="js/api-client.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/user-system.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/wishlist.js" defer></script>
    <script src="js/i18n.js" defer></script>
  <script src="js/pages/wishlist.js" defer></script>

</html>
