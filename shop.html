<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme-init.min.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="shop.meta_title">التسوق | متجر رواق - تصفح المنتجات والتصنيفات</title>
  
  <!-- 1. تحسين محركات البحث (SEO & Social Sharing) -->
  <meta name="description" data-i18n="shop.meta_description" content="تسوق أفضل المنتجات مع متجر رواق، استمتع بعروض وتخفيضات حصرية، جودة مضمونة وتوصيل سريع إلى 58 ولاية مع ميزة الدفع عند الاستلام.">
  <meta property="og:title" data-i18n="shop.meta_title" content="التسوق | متجر رواق - تصفح المنتجات والتصنيفات">
  <meta property="og:description" data-i18n="shop.meta_description" content="تسوق أفضل المنتجات مع متجر رواق، استمتع بعروض وتخفيضات حصرية، جودة مضمونة وتوصيل سريع إلى 58 ولاية مع ميزة الدفع عند الاستلام.">
  <meta property="og:type" content="website">

  <!-- Preload Primary Font & LCP Hero Product Image for Instant Discovery -->
  <link rel="preload" href="/fonts/font-1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" as="image" href="/images/prod_linen_shirt-400.webp" type="image/webp" fetchpriority="high">

  <!-- Critical CSS for Instant Paint and Zero CLS (استقرار أبعاد الصفحة ومنع ارتداد العناصر) -->
  <style>
    :root {
      --primary-color: #4f46e5;
      --dark-color: #0f172a;
      --border-color: #e2e8f0;
      --card-bg: #ffffff;
      --light-color: #f8fafc;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      color: #1e293b;
      background-color: #f8fafc;
      line-height: 1.6;
    }
    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 16px;
    }
    #site-header {
      display: block;
      min-height: 154px;
    }
    .page-title {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      color: #fff;
      padding: 24px 0;
      min-height: 88px;
    }
    .page-title h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .breadcrumb {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.75);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .breadcrumb a {
      color: #fff;
      text-decoration: none;
    }
    .shop-section {
      padding: 24px 0;
      min-height: 600px;
    }

    /* حجز تخطيط الشبكة مسبقاً لمنع انزياح المحتوى (CLS Prevention) */
    .shop-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 32px;
      align-items: flex-start;
    }
    .shop-sidebar {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      position: sticky;
      top: 20px;
    }
    .shop-main {
      min-width: 0;
    }
    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      min-height: 48px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    /* تثبيت أبعاد بطاقات المنتجات وحجز مساحة مربعة 1:1 لجميع الصور */
    .product-card {
      background: var(--card-bg, #ffffff);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color, #e2e8f0);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      min-height: 380px;
      contain: content;
    }
    .product-image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: var(--light-color, #f1f5f9);
    }
    .product-image {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }
    .product-image img {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }
    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    /* هياكل التحميل المؤقتة (Skeleton Placeholders) بنفس الأبعاد والنسبة تماماً */
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px 12px 0 0;
    }

    /* كلاس الإخفاء المرئي لقارئات الشاشة (Screen Readers Accessibility) */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media(max-width: 992px) {
      .shop-layout {
        grid-template-columns: 1fr;
      }
    }
    @media(max-width: 768px) {
      #site-header {
        min-height: 144px;
      }
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
    }
  </style>

  <!-- أنماط الموقع الأساسية والخطوط والأيقونات -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.min.css">
  <noscript><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"></noscript>

  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/images/logo.png">
</head>
<body>
  <!-- رأس الموقع الموحد -->
  <header id="site-header"></header>

  <!-- عنوان الصفحة الرئيسي (H1 الوحيد) -->
  <div class="page-title">
    <div class="container">
      <h1 data-i18n="shop.title">التسوق</h1>
      <div class="breadcrumb">
        <a href="index.html" data-i18n="footer.link_home">الرئيسية</a> <i class="fas fa-chevron-left" aria-hidden="true"></i> <span data-i18n="nav.shop">التسوق</span>
      </div>
    </div>
  </div>

  <!-- قسم المنتجات -->
  <section class="shop-section">
    <div class="container">
      <div class="shop-layout">
        
        <!-- الشريط الجانبي (Sidebar) للفلاتر -->
        <div class="filters-backdrop" id="filtersBackdrop"></div>
        <aside class="shop-sidebar" id="shopSidebar">
          <div class="sidebar-header">
            <!-- H2 متسلسل هرمياً بعد H1 مباشرة -->
            <h2 class="sidebar-title"><i class="fas fa-sliders-h" aria-hidden="true"></i> <span data-i18n="shop.filters_title">فلاتر المنتجات</span></h2>
            <button type="button" class="reset-filters-btn" data-action="resetFilters" data-args=""><i class="fas fa-redo-alt" aria-hidden="true"></i> <span data-i18n="shop.reset_filters">إعادة ضبط</span></button>
            <button type="button" class="filters-close-btn" id="closeFiltersBtn" data-i18n-aria-label="shop.close_filters" aria-label="إغلاق الفلاتر"><i class="fas fa-times" aria-hidden="true"></i></button>
          </div>

          <!-- تصنيفات المنتجات (H3 فرعي يتبع H2) -->
          <div class="filter-group">
            <h3><i class="fas fa-tags" style="color:#0284c7;" aria-hidden="true"></i> <span data-i18n="shop.categories_title">التصنيفات</span></h3>
            <div class="filter-options" id="categoryFilterContainer">
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="" checked data-action="onCategoryChange" data-args="">
                <span data-i18n="shop.cat_all">الكل</span>
                <span class="category-count" id="count-all" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(8)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="أزياء وملابس" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.fashion">أزياء وملابس</span>
                <span class="category-count" id="count-fashion" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(4)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="ساعات وإكسسوارات" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.watches">ساعات وإكسسوارات</span>
                <span class="category-count" id="count-watches" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(1)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="عطور ومستحضرات تجميل" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.beauty">عطور ومستحضرات تجميل</span>
                <span class="category-count" id="count-beauty" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(1)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="منزل وديكور" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.home">منزل وديكور</span>
                <span class="category-count" id="count-home" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(1)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="هواتف وإلكترونيات" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.electronics">هواتف وإلكترونيات</span>
                <span class="category-count" id="count-electronics" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(1)</span>
              </label>
            </div>
          </div>

          <!-- فلتر نطاق السعر (H3 فرعي يتبع H2) -->
          <div class="filter-group">
            <h3><i class="fas fa-coins" style="color:var(--primary-color);" aria-hidden="true"></i> <span data-i18n="shop.max_price_title">أقصى سعر (دج)</span></h3>
            <div class="price-range-box">
              <div class="price-slider-container">
                <label for="priceRange" class="sr-only" data-i18n="shop.price_range_label">نطاق السعر الأقصى</label>
                <input type="range" id="priceRange" min="0" max="200000" step="5000" value="200000" data-action="updatePriceRange" aria-label="نطاق السعر الأقصى" data-i18n-aria-label="shop.price_range_label">
              </div>
              <div class="price-labels">
                <span>0 <span data-i18n="common.currency">دج</span></span>
                <span><span data-i18n="shop.price_up_to">حتى:</span> <strong id="priceRangeValue" style="color:var(--primary-color);">200,000 <span data-i18n="common.currency">دج</span></strong></span>
              </div>
            </div>
          </div>

          <!-- فلتر تقييم النجوم (H3 فرعي يتبع H2) -->
          <div class="filter-group">
            <h3><i class="fas fa-star" style="color:var(--warning-color);" aria-hidden="true"></i> <span data-i18n="shop.rating_title">التقييم</span></h3>
            <div class="filter-options">
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="0" checked data-action="applyFilters" data-args="">
                <span data-i18n="shop.all_ratings">جميع التقييمات</span>
                <span class="category-count" id="count-rating-0" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(8)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="4.5" data-action="applyFilters" data-args="">
                <span data-i18n="shop.stars_4_5">⭐ 4.5 فما فوق (ممتاز)</span>
                <span class="category-count" id="count-rating-4-5" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(4)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="4.0" data-action="applyFilters" data-args="">
                <span data-i18n="shop.stars_4_0">⭐ 4.0 فما فوق (جيد جداً)</span>
                <span class="category-count" id="count-rating-4-0" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(7)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="3.0" data-action="applyFilters" data-args="">
                <span data-i18n="shop.stars_3_0">⭐ 3.0 فما فوق</span>
                <span class="category-count" id="count-rating-3-0" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(8)</span>
              </label>
            </div>
          </div>

          <!-- فلتر حالة المخزون (H3 فرعي يتبع H2) -->
          <div class="filter-group">
            <h3><i class="fas fa-boxes" style="color:var(--success-color);" aria-hidden="true"></i> <span data-i18n="shop.availability_title">التوفر في المتجر</span></h3>
            <div class="filter-options">
              <label class="filter-option-label">
                <input type="checkbox" id="inStockOnly" data-action="applyFilters" data-args="">
                <span data-i18n="shop.in_stock_only">المتوفر في المخزون فقط</span>
              </label>
            </div>
          </div>

          <div class="filters-apply-wrap">
            <button type="button" class="btn filters-apply-btn" id="applyFiltersBtn">
              <span data-i18n="shop.show_results">عرض النتائج</span> <span id="filtersApplyCount"></span>
            </button>
          </div>
        </aside>

        <!-- المحتوى الرئيسي للمنتجات -->
        <main class="shop-main">
          <!-- H2 لقائمة المنتجات لقارئات الشاشة وهيكلة الصفحة -->
          <h2 class="sr-only" data-i18n="shop.products_list">قائمة المنتجات والتصنيفات</h2>

          <div class="products-header">
            <div class="search-box">
              <label for="searchInput" class="sr-only" data-i18n="shop.search_label">البحث عن منتج بالاسم</label>
              <i class="fas fa-search search-icon" aria-hidden="true"></i>
              <input type="text" id="searchInput" data-i18n-placeholder="shop.search_placeholder" placeholder="ابحث عن منتج بالاسم..." data-action="onSearchInput" data-args="">
              <button type="button" id="clearSearchBtn" data-action="clearSearch" data-args="" style="display:none; background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1rem; padding:0 8px; z-index:2;" title="مسح البحث" data-i18n-title="shop.clear_search" aria-label="مسح البحث" data-i18n-aria-label="shop.clear_search">
                <i class="fas fa-times-circle" aria-hidden="true"></i>
              </button>
            </div>
            <div class="filter-box">
              <button type="button" class="filters-toggle-btn" id="openFiltersBtn" aria-controls="shopSidebar" aria-expanded="false">
                <i class="fas fa-sliders-h" aria-hidden="true"></i>
                <span data-i18n="shop.filters_btn">الفلاتر</span>
                <span class="filters-badge" id="filtersBadge" hidden>0</span>
              </button>
              <span id="resultsCount" style="font-weight: 600; color: var(--light-text, #64748b); font-size: 0.9rem;"></span>

              <!-- ربط select بوسم label متوافق و sr-only لقارئات الشاشة -->
              <label for="sortFilter" class="sr-only" data-i18n="shop.sort_label">ترتيب المنتجات حسب</label>
              <select id="sortFilter" name="sortFilter" aria-label="ترتيب المنتجات" data-i18n-aria-label="shop.sort_label" data-action="applyFilters" data-args="">
                <option value="newest" data-i18n="shop.sort_newest">الأحدث أولاً</option>
                <option value="rating-desc" data-i18n="shop.sort_rating">التقييم: الأعلى تقييماً ⭐</option>
                <option value="price-asc" data-i18n="shop.sort_price_asc">السعر: الأقل إلى الأعلى</option>
                <option value="price-desc" data-i18n="shop.sort_price_desc">السعر: الأعلى إلى الأقل</option>
                <option value="name-asc" data-i18n="shop.sort_name_asc">الاسم: أ-ي</option>
                <option value="name-desc" data-i18n="shop.sort_name_desc">الاسم: ي-أ</option>
              </select>
            </div>
          </div>

          <div id="products-container" class="products-grid">
            <!-- هياكل تحميل متطابقة الأبعاد مع بطاقات المنتجات الحقيقية بنسبة 1:1 تمنع CLS كلياً -->
            <div class="product-card skeleton-card" aria-hidden="true">
              <div class="product-image-container skeleton skeleton-image"></div>
              <div class="product-info">
                <div class="skeleton" style="height: 14px; width: 40%; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 18px; width: 80%; margin-bottom: 12px;"></div>
                <div class="skeleton" style="height: 16px; width: 50%; margin-bottom: 16px;"></div>
                <div class="skeleton" style="height: 38px; width: 100%; border-radius: 8px;"></div>
              </div>
            </div>
            <div class="product-card skeleton-card" aria-hidden="true">
              <div class="product-image-container skeleton skeleton-image"></div>
              <div class="product-info">
                <div class="skeleton" style="height: 14px; width: 40%; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 18px; width: 80%; margin-bottom: 12px;"></div>
                <div class="skeleton" style="height: 16px; width: 50%; margin-bottom: 16px;"></div>
                <div class="skeleton" style="height: 38px; width: 100%; border-radius: 8px;"></div>
              </div>
            </div>
            <div class="product-card skeleton-card" aria-hidden="true">
              <div class="product-image-container skeleton skeleton-image"></div>
              <div class="product-info">
                <div class="skeleton" style="height: 14px; width: 40%; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 18px; width: 80%; margin-bottom: 12px;"></div>
                <div class="skeleton" style="height: 16px; width: 50%; margin-bottom: 16px;"></div>
                <div class="skeleton" style="height: 38px; width: 100%; border-radius: 8px;"></div>
              </div>
            </div>
            <div class="product-card skeleton-card" aria-hidden="true">
              <div class="product-image-container skeleton skeleton-image"></div>
              <div class="product-info">
                <div class="skeleton" style="height: 14px; width: 40%; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 18px; width: 80%; margin-bottom: 12px;"></div>
                <div class="skeleton" style="height: 16px; width: 50%; margin-bottom: 16px;"></div>
                <div class="skeleton" style="height: 38px; width: 100%; border-radius: 8px;"></div>
              </div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </main>

      </div>
    </div>
  </section>

  <!-- التذييل الموحد -->
  <footer id="site-footer"></footer>

  <!-- Main Deferred Scripts (Non-Render-Blocking) -->
  <script src="/js/layout.min.js" defer></script>
  <script src="/js/api-client.min.js" defer></script>
  <script src="/js/main.min.js" defer></script>
  <script src="/js/user-system.min.js" defer></script>
  <script src="/js/i18n.min.js" defer></script>
  <script src="/js/pages/shop.min.js" defer></script>
</body>
</html>
