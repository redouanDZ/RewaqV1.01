<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
    <script src="/js/theme-init.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="shop.meta_title">التسوق | متجر رِواق - تصفح المنتجات والتصنيفات</title>
  <!-- Preload Primary Font for LCP / Text Performance -->
  <link rel="preload" href="/fonts/font-1.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Critical CSS for Instant Paint and Zero CLS -->
  <style>
    :root{--primary-color:#4f46e5;--dark-color:#0f172a;--border-color:#e2e8f0;--card-bg:#ffffff;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Cairo',system-ui,-apple-system,sans-serif;color:#1e293b;background-color:#f8fafc;line-height:1.6;}
    .container{width:100%;max-width:1240px;margin:0 auto;padding:0 16px;}
    #site-header{display:block;min-height:154px;}
    .page-title{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);color:#fff;padding:24px 0;min-height:88px;}
    .page-title h1{font-size:1.5rem;font-weight:800;margin-bottom:6px;}
    .breadcrumb{font-size:0.85rem;color:rgba(255,255,255,0.75);display:flex;align-items:center;gap:8px;}
    .breadcrumb a{color:#fff;text-decoration:none;}
    .shop-section{padding:24px 0;min-height:600px;}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;}
    .product-skeleton-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;min-height:360px;}
    @media(max-width:768px){
      #site-header{min-height:144px;}
      .products-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
    }
  </style>

  <!-- Asynchronous Non-blocking Stylesheets -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"></noscript>
  <link rel="stylesheet" href="css/style.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/style.min.css"></noscript>

  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/images/logo.png">

</head>
<body>
  <!-- رأس الموقع الموحد -->
  <header id="site-header"></header>

  <!-- عنوان الصفحة -->
  <div class="page-title">
    <div class="container">
      <h1 data-i18n="shop.title">التسوق</h1>
      <div class="breadcrumb">
        <a href="index.html" data-i18n="footer.link_home">الرئيسية</a> <i class="fas fa-chevron-left"></i> <span data-i18n="nav.shop">التسوق</span>
      </div>
    </div>
  </div>

  <!-- قسم المنتجات -->
  <section class="shop-section">
    <div class="container">
      <div class="shop-layout">
        
        <!-- الشريط الجانبي (Sidebar) للفلاتر -->
        <div class="filters-backdrop" id="filtersBackdrop"></div>
        <aside class="shop-sidebar" id="shopSidebar">
          <div class="sidebar-header">
            <h3><i class="fas fa-sliders-h"></i> <span data-i18n="shop.filters_title">فلاتر المنتجات</span></h3>
            <button type="button" class="reset-filters-btn" data-action="resetFilters" data-args=""><i class="fas fa-redo-alt"></i> <span data-i18n="shop.reset_filters">إعادة ضبط</span></button>
            <button type="button" class="filters-close-btn" id="closeFiltersBtn" data-i18n-aria-label="shop.close_filters" aria-label="إغلاق الفلاتر"><i class="fas fa-times" aria-hidden="true"></i></button>
          </div>

          <!-- تصنيفات المنتجات -->
          <div class="filter-group">
            <h4><i class="fas fa-tags" style="color:#0284c7;"></i> <span data-i18n="shop.categories_title">التصنيفات</span></h4>
            <div class="filter-options" id="categoryFilterContainer">
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="" checked data-action="onCategoryChange" data-args="">
                <span data-i18n="shop.cat_all">الكل</span>
                <span class="category-count" id="count-all" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(8)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="أزياء وملابس" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.fashion">أزياء وملابس</span>
                <span class="category-count" id="count-fashion" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(4)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="ساعات وإكسسوارات" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.watches">ساعات وإكسسوارات</span>
                <span class="category-count" id="count-watches" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(1)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="عطور ومستحضرات تجميل" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.beauty">عطور ومستحضرات تجميل</span>
                <span class="category-count" id="count-beauty" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(1)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="منزل وديكور" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.home">منزل وديكور</span>
                <span class="category-count" id="count-home" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(1)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="categoryFilter" value="هواتف وإلكترونيات" data-action="onCategoryChange" data-args="">
                <span data-i18n="categories.electronics">هواتف وإلكترونيات</span>
                <span class="category-count" id="count-electronics" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(1)</span>
              </label>
            </div>
          </div>

          <!-- فلتر نطاق السعر -->
          <div class="filter-group">
            <h4><i class="fas fa-coins" style="color:var(--primary-color);"></i> <span data-i18n="shop.max_price_title">أقصى سعر (دج)</span></h4>
            <div class="price-range-box">
              <div class="price-slider-container">
                <input type="range" id="priceRange" min="0" max="200000" step="5000" value="200000" data-action="updatePriceRange">
              </div>
              <div class="price-labels">
                <span>0 <span data-i18n="common.currency">دج</span></span>
                <span><span data-i18n="shop.price_up_to">حتى:</span> <strong id="priceRangeValue" style="color:var(--primary-color);">200,000 <span data-i18n="common.currency">دج</span></strong></span>
              </div>
            </div>
          </div>

          <!-- فلتر تقييم النجوم -->
          <div class="filter-group">
            <h4><i class="fas fa-star" style="color:var(--warning-color);"></i> <span data-i18n="shop.rating_title">التقييم</span></h4>
            <div class="filter-options">
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="0" checked data-action="applyFilters" data-args="">
                <span data-i18n="shop.all_ratings">جميع التقييمات</span>
                <span class="category-count" id="count-rating-0" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(8)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="4.5" data-action="applyFilters" data-args="">
                <span data-i18n="shop.stars_4_5">⭐ 4.5 فما فوق (ممتاز)</span>
                <span class="category-count" id="count-rating-4-5" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(4)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="4.0" data-action="applyFilters" data-args="">
                <span data-i18n="shop.stars_4_0">⭐ 4.0 فما فوق (جيد جداً)</span>
                <span class="category-count" id="count-rating-4-0" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(7)</span>
              </label>
              <label class="filter-option-label">
                <input type="radio" name="ratingFilter" value="3.0" data-action="applyFilters" data-args="">
                <span data-i18n="shop.stars_3_0">⭐ 3.0 فما فوق</span>
                <span class="category-count" id="count-rating-3-0" style="margin-inline-start:auto; font-size:0.8rem; font-weight:600; color:#94a3b8;">(8)</span>
              </label>
            </div>
          </div>

          <!-- فلتر حالة المخزون -->
          <div class="filter-group">
            <h4><i class="fas fa-boxes" style="color:var(--success-color);"></i> <span data-i18n="shop.availability_title">التوفر في المتجر</span></h4>
            <div class="filter-options">
              <label class="filter-option-label">
                <input type="checkbox" id="inStockOnly" data-action="applyFilters" data-args="">
                <span data-i18n="shop.in_stock_only">المتوفر في المخزون فقط</span>
              </label>
            </div>
          </div>

          <div class="filters-apply-wrap">
            <button type="button" class="btn filters-apply-btn" id="applyFiltersBtn">
              <span data-i18n="shop.show_results">عرض النتائج</span> <span id="filtersApplyCount"></span>
            </button>
          </div>
        </aside>

        <!-- المحتوى الرئيسي للمنتجات -->
        <main class="shop-main">
          <div class="products-header">
            <div class="search-box">
              <i class="fas fa-search fa-search"></i>
              <input type="text" id="searchInput" data-i18n-placeholder="shop.search_placeholder" placeholder="ابحث عن منتج بالاسم..." data-action="onSearchInput" data-args="">
              <button type="button" id="clearSearchBtn" data-action="clearSearch" data-args="" style="display:none; background:none; border:none; color:#94a3b8; cursor:pointer; font-size:1rem; padding:0 8px; z-index:2;" title="مسح البحث" data-i18n-title="shop.clear_search" aria-label="مسح البحث" data-i18n-aria-label="shop.clear_search">
                <i class="fas fa-times-circle"></i>
              </button>
            </div>
            <div class="filter-box">
              <button type="button" class="filters-toggle-btn" id="openFiltersBtn" aria-controls="shopSidebar" aria-expanded="false">
                <i class="fas fa-sliders-h" aria-hidden="true"></i>
                <span data-i18n="shop.filters_btn">الفلاتر</span>
                <span class="filters-badge" id="filtersBadge" hidden>0</span>
              </button>
              <span id="resultsCount" style="font-weight: 600; color: var(--light-text, #64748b); font-size: 0.9rem;"></span>
              <select id="sortFilter" data-action="applyFilters" data-args="">
                <option value="newest" data-i18n="shop.sort_newest">الأحدث أولاً</option>
                <option value="rating-desc" data-i18n="shop.sort_rating">التقييم: الأعلى تقييماً ⭐</option>
                <option value="price-asc" data-i18n="shop.sort_price_asc">السعر: الأقل إلى الأعلى</option>
                <option value="price-desc" data-i18n="shop.sort_price_desc">السعر: الأعلى إلى الأقل</option>
                <option value="name-asc" data-i18n="shop.sort_name_asc">الاسم: أ-ي</option>
                <option value="name-desc" data-i18n="shop.sort_name_desc">الاسم: ي-أ</option>
              </select>
            </div>
          </div>

          <div id="products-container" class="products-grid">
            <!-- Animated Skeleton Loading Placeholders -->
            <div class="product-skeleton-card">
              <div class="skeleton skeleton-image"></div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-price"></div>
              <div class="skeleton-actions">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
              </div>
            </div>
            <div class="product-skeleton-card">
              <div class="skeleton skeleton-image"></div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-price"></div>
              <div class="skeleton-actions">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
              </div>
            </div>
            <div class="product-skeleton-card">
              <div class="skeleton skeleton-image"></div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-price"></div>
              <div class="skeleton-actions">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
              </div>
            </div>
            <div class="product-skeleton-card">
              <div class="skeleton skeleton-image"></div>
              <div class="skeleton skeleton-title"></div>
              <div class="skeleton skeleton-price"></div>
              <div class="skeleton-actions">
                <div class="skeleton skeleton-btn"></div>
                <div class="skeleton skeleton-btn"></div>
              </div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </main>

      </div>
    </div>
  </section>

  <!-- التذييل الموحد -->
  <footer id="site-footer"></footer>

  <!-- Main Deferred Scripts -->
  <script src="js/layout.js" defer></script>
  <script src="js/api-client.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/pages/shop.js" defer></script>
</body>
</html>
